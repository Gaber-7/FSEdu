# ═══════════════════════════════════════════════════════
# Coturn TURN/STUN Server — for WebRTC NAT traversal
# ═══════════════════════════════════════════════════════

# Listening
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay range (must match LiveKit RTC range)
min-port=49160
max-port=49200

# Static auth (LiveKit will generate per-user credentials at runtime,
# but we provide fallback for direct STUN/TURN clients)
fingerprint
lt-cred-mech
realm=fsedu.local
user=fsedu:CHANGE_ME_TURN_PASSWORD

# Performance
no-loopback-peers
no-multicast-peers
mobility
no-cli

# TLS (Caddy/Let's Encrypt provides certs at /etc/letsencrypt — bind volume on prod)
# cert=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
# pkey=/etc/letsencrypt/live/${DOMAIN}/privkey.pem

# Logging
log-file=stdout
verbose
