# ═══════════════════════════════════════════════════════════════════════
# FSEdu — Production Deployment for Hetzner CCX23
# Single-server stack: API + Web + SQL Server + LiveKit + Caddy + Coturn
#
# Usage:
#   1. Copy deploy/.env.example → .env, fill values
#   2. docker compose up -d
# ═══════════════════════════════════════════════════════════════════════

name: fsedu

services:

  # ─── SQL Server 2022 ──────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fsedu-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - fsedu
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── FSEdu API (.NET 9) ───────────────────────────
  api:
    build:
      context: .
      dockerfile: src/Presentation/FSEdu.Api/Dockerfile
    container_name: fsedu-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=db;Database=FSEdu;User Id=sa;Password=${DB_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__Issuer: "${PUBLIC_URL}"
      Jwt__Audience: "FSEdu.Users"
      LiveKit__Url: "${LIVEKIT_URL}"
      LiveKit__ApiKey: "${LIVEKIT_API_KEY}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET}"
      PaymentAccounts__InstaPayNumber: "${INSTAPAY_NUMBER}"
      PaymentAccounts__InstaPayLink: "${INSTAPAY_LINK}"
      PaymentAccounts__VodafoneCashNumber: "${VFCASH_NUMBER}"
      PaymentAccounts__BankName: "${BANK_NAME}"
      PaymentAccounts__BankAccount: "${BANK_ACCOUNT}"
      PaymentAccounts__BankIban: "${BANK_IBAN}"
      PaymentAccounts__AccountHolder: "${ACCOUNT_HOLDER}"
    volumes:
      - api-uploads:/app/wwwroot/uploads
      - recordings:/app/wwwroot/recordings:ro  # serve recordings from API
    # Bind to host loopback so host-net containers (livekit, egress)
    # can reach the API for webhooks at http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - fsedu

  # ─── FSEdu Web (Blazor) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: src/Presentation/FSEdu.Web/Dockerfile
    container_name: fsedu-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: "https://${DOMAIN}/api/"
      LiveKit__Url: "wss://${DOMAIN}/livekit/"
    networks:
      - fsedu

  # ─── Redis (used by LiveKit Egress for job queue) ─
  redis:
    image: redis:7-alpine
    container_name: fsedu-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Bind to host loopback so host-net Egress can reach Redis at localhost:6379
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - fsedu

  # ─── LiveKit Server (Video SFU) ───────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: fsedu-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    network_mode: host  # required for WebRTC port range
    depends_on:
      - redis

  # ─── LiveKit Egress (Recording lectures to disk) ──
  livekit-egress:
    image: livekit/egress:latest
    container_name: fsedu-egress
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN  # required for Chrome inside Egress
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        insecure: true
        file_outputs:
          - directory: /recordings
    volumes:
      - recordings:/recordings
      - /tmp:/tmp
    network_mode: host
    depends_on:
      - livekit
      - redis

  # ─── Coturn (TURN/STUN for NAT traversal) ─────────
  coturn:
    image: coturn/coturn:latest
    container_name: fsedu-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn.conf:/etc/coturn/turnserver.conf:ro

  # ─── Caddy (Reverse Proxy + Auto SSL) ─────────────
  caddy:
    image: caddy:2-alpine
    container_name: fsedu-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN}"
    # Allow Caddy (bridge) to reach LiveKit (host network) at host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - web
    networks:
      - fsedu

volumes:
  db-data:
  api-uploads:
  recordings:
  caddy-data:
  caddy-config:

networks:
  fsedu:
    driver: bridge
